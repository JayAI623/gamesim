[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesim"
version = "0.8.0"
description = "LLM 博弈论推演框架：Claude 扮演各方、独立 GM 裁决、BDM 基线、多局编排与第二层策略打分"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "JayAI623"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gamesim = "gamesim.cli:main"

[tool.setuptools]
packages = ["gamesim"]

[tool.setuptools.package-data]
gamesim = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
